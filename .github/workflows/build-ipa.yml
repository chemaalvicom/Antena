name: Compilar IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Versión de Xcode
        run: xcodebuild -version

      - name: Instalar XcodeGen y CocoaPods
        run: |
          brew install xcodegen
          command -v pod >/dev/null || sudo gem install cocoapods

      - name: Generar proyecto
        run: |
          xcodegen generate
          pod install --repo-update

      - name: Compilar (sin firmar)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace Antena.xcworkspace \
            -scheme Antena \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tail -n 200

      - name: Empaquetar IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Antena.app Payload/
          zip -qry Antena.ipa Payload
          ls -lh Antena.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Antena-ipa
          path: Antena.ipa
          retention-days: 30
