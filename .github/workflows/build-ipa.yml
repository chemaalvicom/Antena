name: Compilar ANTENA PRO

on:
  push:
    branches: [main, antena-pro]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # Firma (ver FIRMA.md). Si faltan, se compila sin firmar solo para comprobar el código.
      CERT_P12_BASE64: ${{ secrets.CERT_P12_BASE64 }}
      CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
      APP_PROFILE_BASE64: ${{ secrets.APP_PROFILE_BASE64 }}
      TUNNEL_PROFILE_BASE64: ${{ secrets.TUNNEL_PROFILE_BASE64 }}
      # Configuración WireGuard que se mete dentro de la app (sin QR). Solo en builds de TestFlight.
      WG_CONFIG: ${{ secrets.WG_CONFIG }}
      # Clave de API de App Store Connect para subir a TestFlight.
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4

      - name: Versión de Xcode
        run: xcodebuild -version

      # Go para compilar la parte de WireGuard. Versión fijada: el parche de runtime de
      # wireguard-apple está probado con esta rama de Go.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21.13'
          cache: false

      - name: Instalar XcodeGen y CocoaPods
        run: |
          brew install xcodegen
          command -v pod >/dev/null || sudo gem install cocoapods

      - name: Compilar WireGuard (Go → libwg-go.a)
        run: ./scripts/build-wireguard.sh

      - name: Preparar firma
        id: signing
        run: |
          if [ -z "$CERT_P12_BASE64" ] || [ -z "$APP_PROFILE_BASE64" ] || [ -z "$TUNNEL_PROFILE_BASE64" ]; then
            echo "::warning::Faltan los secrets de firma: la IPA saldrá SIN FIRMAR y la VPN no funcionará. Ver FIRMA.md"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "method=none" >> "$GITHUB_OUTPUT"
            { echo "TEAM_ID="; echo "APP_PROFILE_NAME="; echo "TUNNEL_PROFILE_NAME="; echo "EXPORT_METHOD=none"; } >> "$GITHUB_ENV"
            exit 0
          fi

          # Llavero temporal con el certificado de distribución
          KEYCHAIN="$RUNNER_TEMP/firma.keychain-db"
          KEYCHAIN_PASS="$(uuidgen)"
          echo "$CERT_P12_BASE64" | tr -d ' \r\n' | base64 --decode > "$RUNNER_TEMP/cert.p12"

          # Normaliza el .p12/.pfx: OpenSSL lee también el cifrado AES que usa Windows y lo
          # reescribe en el formato clásico que entiende "security" en macOS.
          OPENSSL="$(brew --prefix openssl@3)/bin/openssl"
          P12_PASS="$(printf '%s' "$CERT_PASSWORD" | tr -d '\r\n')"
          OPENED=false
          # Prueba la contraseña del secret y, por si el .p12 se exportó sin contraseña, vacía.
          for TRY in "$P12_PASS" ""; do
            for MODE in "" "-legacy"; do
              if P12_PASS="$TRY" "$OPENSSL" pkcs12 $MODE -in "$RUNNER_TEMP/cert.p12" -passin env:P12_PASS \
                   -nodes -out "$RUNNER_TEMP/cert.pem" 2>>"$RUNNER_TEMP/p12.err"; then
                OPENED=true
                [ -z "$TRY" ] && echo "::warning::El .p12 no tiene contraseña (se ignoró CERT_PASSWORD)"
                break 2
              fi
            done
          done
          if [ "$OPENED" != true ]; then
            tail -3 "$RUNNER_TEMP/p12.err"
            echo "::error::CERT_PASSWORD no abre el .p12 de CERT_P12_BASE64 (${#P12_PASS} caracteres). Revisa la contraseña o que los dos secrets sean del mismo archivo."
            exit 1
          fi
          grep -q "PRIVATE KEY" "$RUNNER_TEMP/cert.pem" || {
            echo "::error::El .p12 no contiene la clave privada (¿es un .cer renombrado?). Expórtalo con la clave privada."
            exit 1
          }
          IMPORT_PASS="$(uuidgen)"
          IMPORT_PASS="$IMPORT_PASS" "$OPENSSL" pkcs12 -export -legacy -in "$RUNNER_TEMP/cert.pem" \
            -passout env:IMPORT_PASS -out "$RUNNER_TEMP/cert-mac.p12"
          rm -f "$RUNNER_TEMP/cert.pem" "$RUNNER_TEMP/p12.err" "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert-mac.p12" -P "$IMPORT_PASS" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert-mac.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN"

          # Perfiles (app y extensión). Se referencian por UUID para evitar problemas con los nombres.
          install_profile() {
            local file="$RUNNER_TEMP/$1.mobileprovision"
            echo "$2" | tr -d ' \r\n' | base64 --decode > "$file"
            security cms -D -i "$file" > "$RUNNER_TEMP/$1.plist"
            local uuid
            uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/$1.plist")
            for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
              mkdir -p "$dir"
              cp "$file" "$dir/$uuid.mobileprovision"
            done
            echo "$uuid"
          }
          APP_PROFILE_UUID=$(install_profile app "$APP_PROFILE_BASE64")
          TUNNEL_PROFILE_UUID=$(install_profile tunnel "$TUNNEL_PROFILE_BASE64")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/app.plist")

          for p in app tunnel; do
            echo "Perfil $p: $(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/$p.plist" | LC_ALL=C tr -cd '[:print:]') · App ID $(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/$p.plist")"
          done

          # Ad Hoc si el perfil lleva lista de dispositivos; si no, App Store (TestFlight)
          if /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$RUNNER_TEMP/app.plist" >/dev/null 2>&1; then
            METHOD=release-testing
          else
            METHOD=app-store-connect
          fi

          {
            echo "TEAM_ID=$TEAM_ID"
            echo "APP_PROFILE_NAME=$APP_PROFILE_UUID"
            echo "TUNNEL_PROFILE_NAME=$TUNNEL_PROFILE_UUID"
            echo "EXPORT_METHOD=$METHOD"
          } >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "method=$METHOD" >> "$GITHUB_OUTPUT"
          echo "Equipo $TEAM_ID - metodo $METHOD"

      # La configuración con la clave privada solo viaja dentro de builds de TestFlight
      # (privadas de tu cuenta). Nunca en una IPA que se publique en el repositorio.
      - name: Incluir configuración de la VPN
        id: vpnconf
        run: |
          if [ -z "$WG_CONFIG" ]; then
            echo "embedded=false" >> "$GITHUB_OUTPUT"
            echo "Sin WG_CONFIG: la app pedirá la configuración (QR/archivo) al abrirla"
            exit 0
          fi
          if [ "$EXPORT_METHOD" != "app-store-connect" ]; then
            echo "::error::WG_CONFIG solo se incluye en builds de TestFlight (perfiles App Store). Con perfiles Ad Hoc la IPA podría acabar publicada con tu clave."
            exit 1
          fi
          printf '%s\n' "$WG_CONFIG" | tr -d '\r' > Antena/Resources/vpn-embebida.txt
          for key in '\[Interface\]' 'PrivateKey' '\[Peer\]' 'PublicKey' 'Endpoint'; do
            grep -q "$key" Antena/Resources/vpn-embebida.txt || { echo "::error::A WG_CONFIG le falta $key"; exit 1; }
          done
          echo "embedded=true" >> "$GITHUB_OUTPUT"
          echo "Configuración de la VPN incluida en la app"

      - name: Generar proyecto
        run: |
          xcodegen generate
          pod install --repo-update

      - name: Compilar y firmar
        if: steps.signing.outputs.signed == 'true'
        run: |
          set -o pipefail
          xcodebuild \
            -workspace Antena.xcworkspace \
            -scheme Antena \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/AntenaPro.xcarchive \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            archive | tail -n 200

          DESTINATION=export
          if [ "$EXPORT_METHOD" = "app-store-connect" ]; then
            if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
              echo "::error::Perfiles de App Store sin clave de API: faltan ASC_KEY_ID, ASC_ISSUER_ID o ASC_KEY_P8"
              exit 1
            fi
          fi

          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>${EXPORT_METHOD}</string>
            <key>destination</key><string>${DESTINATION}</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>stripSwiftSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.chemablanco.antenapro</key><string>${APP_PROFILE_NAME}</string>
              <key>com.chemablanco.antenapro.tunnel</key><string>${TUNNEL_PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath build/AntenaPro.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export | tail -n 80
          IPA=$(ls build/export/*.ipa | head -1)
          ls -lh "$IPA"

          if [ "$EXPORT_METHOD" = "app-store-connect" ]; then
            # Limpia espacios y saltos de línea que se cuelan al pegar los secrets
            ASC_KEY_ID="$(printf '%s' "$ASC_KEY_ID" | tr -d ' \r\n\t')"
            ASC_ISSUER_ID="$(printf '%s' "$ASC_ISSUER_ID" | tr -d ' \r\n\t')"
            echo "Key ID: ${#ASC_KEY_ID} caracteres (debe ser 10) · Issuer ID: ${#ASC_ISSUER_ID} caracteres (debe ser 36)"
            [[ "$ASC_ISSUER_ID" =~ ^[0-9a-f-]{36}$ ]] || echo "::warning::ASC_ISSUER_ID no tiene forma de UUID (¿está intercambiado con ASC_KEY_ID?)"

            # altool busca la clave en ~/.appstoreconnect/private_keys/AuthKey_<ID>.p8
            KEYDIR="$HOME/.appstoreconnect/private_keys"
            mkdir -p "$KEYDIR"
            KEYFILE="$KEYDIR/AuthKey_${ASC_KEY_ID}.p8"
            printf '%s\n' "$ASC_KEY_P8" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e '/^$/d' > "$KEYFILE"
            head -1 "$KEYFILE" | grep -q 'BEGIN PRIVATE KEY' || echo "::warning::ASC_KEY_P8 no empieza por -----BEGIN PRIVATE KEY-----"

            # Comprobación previa contra la API de App Store Connect (mensaje de error claro)
            python3 -m venv "$RUNNER_TEMP/jwtenv" >/dev/null && "$RUNNER_TEMP/jwtenv/bin/pip" install -q pyjwt cryptography
            ASC_KEY_ID="$ASC_KEY_ID" ASC_ISSUER_ID="$ASC_ISSUER_ID" KEYFILE="$KEYFILE" "$RUNNER_TEMP/jwtenv/bin/python" - <<'PY' || true
          import os, time, json, urllib.request, urllib.error, jwt
          key = open(os.environ["KEYFILE"]).read()
          try:
              token = jwt.encode({"iss": os.environ["ASC_ISSUER_ID"], "iat": int(time.time()), "exp": int(time.time()) + 600,
                                  "aud": "appstoreconnect-v1"}, key, algorithm="ES256", headers={"kid": os.environ["ASC_KEY_ID"]})
          except Exception as e:
              print("::warning::La clave .p8 no es válida:", e); raise SystemExit
          req = urllib.request.Request("https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]=com.chemablanco.antenapro",
                                       headers={"Authorization": "Bearer " + token})
          try:
              data = json.load(urllib.request.urlopen(req, timeout=30))
              print("API de App Store Connect OK · apps con ese Bundle ID:", len(data.get("data", [])))
          except urllib.error.HTTPError as e:
              body = e.read().decode(errors="replace")
              print(f"::warning::App Store Connect API respondió {e.code}: {body[:400]}")
          PY
            set +e
            xcrun altool --upload-app -f "$IPA" -t ios \
              --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" --output-format normal
            RC=$?
            set -e
            rm -rf "$HOME/.appstoreconnect"
            rm -f "$IPA"
            if [ $RC -ne 0 ]; then
              echo "::error::La subida a App Store Connect ha fallado (ver el mensaje de altool arriba)"
              exit $RC
            fi
            echo "Subida a TestFlight: build $GITHUB_RUN_NUMBER. Aparecerá en la app TestFlight en unos minutos."
            echo "### ANTENA PRO subida a TestFlight (build $GITHUB_RUN_NUMBER)" >> "$GITHUB_STEP_SUMMARY"
          else
            cp "$IPA" AntenaPro.ipa
          fi

      - name: Compilar (sin firmar, solo comprobación)
        if: steps.signing.outputs.signed != 'true'
        run: |
          set -o pipefail
          xcodebuild \
            -workspace Antena.xcworkspace \
            -scheme Antena \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tail -n 200
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Antena.app Payload/
          zip -qry AntenaPro.ipa Payload
          ls -lh AntenaPro.ipa

      - name: Limpiar llavero y configuración
        if: always()
        run: |
          rm -f Antena/Resources/vpn-embebida.txt
          security delete-keychain "$RUNNER_TEMP/firma.keychain-db" 2>/dev/null || true

      # Solo se publican IPAs que NO llevan la configuración de la VPN dentro.
      - uses: actions/upload-artifact@v4
        if: steps.vpnconf.outputs.embedded != 'true' && steps.signing.outputs.method != 'app-store-connect'
        with:
          name: AntenaPro-ipa
          path: AntenaPro.ipa
          retention-days: 30

      - name: Publicar release
        if: steps.vpnconf.outputs.embedded != 'true' && steps.signing.outputs.method != 'app-store-connect'
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          VERSION=$(grep -E '^\s*MARKETING_VERSION:' project.yml | head -1 | sed -E 's/.*"(.*)".*/\1/')
          TAG="pro-v${VERSION}-build${GITHUB_RUN_NUMBER}"
          if [ "$SIGNED" = "true" ]; then
            NOTES="IPA firmada (Ad Hoc). Instálala tal cual, sin volver a firmarla. No lleva la configuración de la VPN."
          else
            NOTES="IPA SIN FIRMAR: solo comprueba que compila. La VPN necesita la firma de Actions (ver FIRMA.md)."
          fi
          shasum -a 256 AntenaPro.ipa | tee AntenaPro.ipa.sha256
          gh release create "$TAG" AntenaPro.ipa AntenaPro.ipa.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ANTENA PRO $VERSION (build $GITHUB_RUN_NUMBER)" \
            --notes "$NOTES" \
            --latest=false
