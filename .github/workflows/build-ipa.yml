name: Compilar IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Versión de Xcode
        run: xcodebuild -version

      - name: Instalar XcodeGen y CocoaPods
        run: |
          brew install xcodegen
          command -v pod >/dev/null || sudo gem install cocoapods

      - name: Generar proyecto
        run: |
          xcodegen generate
          pod install --repo-update

      - name: Compilar (sin firmar)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace Antena.xcworkspace \
            -scheme Antena \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tail -n 200

      - name: Empaquetar IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Antena.app Payload/
          zip -qry Antena.ipa Payload
          ls -lh Antena.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Antena-ipa
          path: Antena.ipa
          retention-days: 30

      # Publica la IPA como release: enlace fijo y público
      # https://github.com/<repo>/releases/latest/download/Antena.ipa
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -E '^\s*MARKETING_VERSION:' project.yml | head -1 | sed -E 's/.*"(.*)".*/\1/')
          TAG="v${VERSION}-build${GITHUB_RUN_NUMBER}"
          shasum -a 256 Antena.ipa | tee Antena.ipa.sha256
          gh release create "$TAG" Antena.ipa Antena.ipa.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Antena $VERSION (build $GITHUB_RUN_NUMBER)" \
            --notes "IPA sin firmar. Fírmala con ESign." \
            --latest
